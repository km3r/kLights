<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>despacio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="header" class="header">
  <div class="header-row">
    <span id="connDot" class="conn-dot" title="connection status"></span>
    <div id="headerWidgets" class="header-widgets"></div>
  </div>
  <div id="parkBadge" class="park-badge" hidden></div>
  <div id="aimBadge" class="park-badge aim-badge" hidden></div>
  <div id="configBadge" class="park-badge config-badge" hidden></div>
  <div id="banner" class="banner" hidden></div>
</header>

<main id="main" class="main"></main>

<div id="toast" class="toast" hidden></div>

<nav id="tabbar" class="tabbar"></nav>

<!-- Data first (plain globals, no bundler): generated config, then the
     hand-curated layout, then the app that reads both. -->
<script src="ui_config.js"></script>
<script src="ui_layout.js"></script>
<script src="app.js"></script>
</body>
</html>
