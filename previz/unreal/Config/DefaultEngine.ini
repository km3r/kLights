; kLights previz project settings.
;
; Only two things here are not stock: Python remote execution (the agentic
; control path -- see previz/README.md) and the render settings that make a
; 3-degree beam in a hazy room actually visible.

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/Previz.Previz
GameDefaultMap=/Game/Maps/Previz.Previz

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
; Remote execution is how scripts in this repo get pushed into a running
; editor. UE 5.8 ships an MCP *client* toolset (the in-editor assistant dialling
; out to MCP servers), not an MCP server -- so this, not MCP, is the hook.
bRemoteExecution=True
; Editor and client are on the same machine, so bind the loopback adapter
; explicitly. 0.0.0.0 picks an arbitrary adapter on a multi-NIC Windows box and
; the discovery ping then goes out of the wrong one, which looks exactly like
; "the editor is not listening".
RemoteExecutionMulticastGroupEndpoint=239.0.0.1:6766
RemoteExecutionMulticastBindAddress=127.0.0.1
RemoteExecutionMulticastTtl=0
; The repo root, so `import engine` and `import previz` work in editor Python.
; Relative to this .uproject's folder.
+AdditionalPaths=(Path="../../")

[/Script/Engine.RendererSettings]
; Volumetric fog is what makes a beam a visible shaft of light rather than just
; a bright spot on a wall. Without it a 3-degree beam is invisible until it
; lands, which is useless for judging a look.
; The froxel grid is screen tiles by DEPTH SLICE, and the beading that makes a
; beam look like a chain of blobs comes from the depth axis. Measured on a
; single-beam shot: (pixel 2, Z 128) beads badly, (2, 512) is clean, and
; (4, 512) is just as clean at the same cost as (2, 128). Spend the budget on Z.
; THIS SECTION IS THE SOURCE for these. build_level.apply_render_cvars() reads
; the `r.` lines out of this file and pushes them into the running editor, so a
; fresh editor starts correct from the ini and an already-open one is updated
; from the same numbers.
;
; It used to be two copies, one here and one written out again in Python, each
; with a comment saying they must match. They drifted anyway, and the symptom
; was fog that looked different before and after the first rebuild of a
; session -- about as hard to attribute as a symptom gets. Edit here only.
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=4
r.VolumetricFog.GridSizeZ=512
r.VolumetricFog.HistoryMissSupersampleCount=16
; Leave at the stock 32. Lowering it to spread depth slices over a small room
; is the obvious move and it is wrong: at 8 the beam is measurably beadier, and
; at 1 the far half of the room renders as a solid black rectangle.
r.VolumetricFog.DepthDistributionScale=32
; Fixed exposure, deliberately: a previz whose exposure drifts with the look
; cannot be compared shot to shot, and "is this brighter than before" is most of
; what previz is asked.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
; Lumen's software tracing is fine here and much cheaper than hardware RT for a
; room this small; the show is mostly direct light and haze anyway.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
