; kLights previz: what a packaged build contains.

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=kLights Previz
CompanyName=kLights

[/Script/UnrealEd.ProjectPackagingSettings]
; One map, and it is nearly empty: everything in it is spawned at runtime from
; the engine's scene, so nothing the cooker could follow references to is in it.
+MapsToCook=(FilePath="/Game/Maps/KLights")
; ...which is why these are listed outright. The app loads them by path, and an
; asset nothing references is simply not cooked -- the load returns null in the
; packaged build only, never in the editor.
+DirectoriesToAlwaysCook=(Path="/Game/Previz/Materials")
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
; Content/Python is editor tooling, not app content.
+DirectoriesToNeverCook=(Path="/Game/Python")
bUseIoStore=True
bShareMaterialShaderCode=True
UsePakFile=True
